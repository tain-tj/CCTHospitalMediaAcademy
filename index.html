<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบตอบรับเข้าร่วมการประชุม</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SweetAlert2 for beautiful popups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Google Fonts: Sarabun (Popular Thai Font) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6; /* Tailwind gray-100 */
        }
        input[type="radio"]:checked {
            accent-color: #2563eb; /* Tailwind blue-600 */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <!-- Card Container -->
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden">
        
        <!-- Header Section -->
        <div class="bg-blue-600 p-6 md:p-8 text-center text-white">
            <h1 class="text-2xl md:text-3xl font-bold mb-2 leading-tight">แบบตอบรับเข้าร่วมการประชุม</h1>
            <p class="text-blue-100 md:text-lg">โครงการ CCT Hospital Media Academy<br>วันที่ 30 พฤศจิกายน 2026 เวลา 10.00-12.00 น.<br>ณ ห้องประชุมอาคาร 75 ปี จ.เชียงใหม่</p>
        </div>

        <!-- Form Section -->
        <div class="p-6 md:p-8">
            <form id="rsvpForm" name="submit-to-google-sheet">
                
                <!-- Name and Surname Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label for="firstName" class="block text-sm font-semibold text-gray-700 mb-1">ชื่อ <span class="text-red-500">*</span></label>
                        <input type="text" id="firstName" name="firstName" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
                            placeholder="ระบุชื่อ">
                    </div>
                    <div>
                        <label for="lastName" class="block text-sm font-semibold text-gray-700 mb-1">นามสกุล <span class="text-red-500">*</span></label>
                        <input type="text" id="lastName" name="lastName" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
                            placeholder="ระบุนามสกุล">
                    </div>
                </div>

                <!-- Organization -->
                <div class="mb-4">
                    <label for="organization" class="block text-sm font-semibold text-gray-700 mb-1">หน่วยงาน <span class="text-red-500">*</span></label>
                    <input type="text" id="organization" name="organization" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
                        placeholder="ระบุหน่วยงานที่สังกัด">
                </div>

                <!-- Position -->
                <div class="mb-6">
                    <label for="position" class="block text-sm font-semibold text-gray-700 mb-1">ตำแหน่ง <span class="text-red-500">*</span></label>
                    <input type="text" id="position" name="position" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors"
                        placeholder="ระบุตำแหน่ง">
                </div>

                <!-- Divider -->
                <hr class="border-gray-200 mb-6">

                <!-- Attendance Radio Buttons -->
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">การเข้าร่วมประชุม <span class="text-red-500">*</span></label>
                    <div class="space-y-3">
                        <label class="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                            <input type="radio" name="attendance" value="เข้าร่วมได้" required class="w-5 h-5 text-blue-600" onchange="toggleLocationField()">
                            <span class="ml-3 text-gray-800 font-medium">เข้าร่วมได้</span>
                        </label>
                        <label class="flex items-center p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition-colors">
                            <input type="radio" name="attendance" value="ไม่สามารถเข้าร่วมได้" required class="w-5 h-5 text-blue-600" onchange="toggleLocationField()">
                            <span class="ml-3 text-gray-800 font-medium">ไม่สามารถเข้าร่วมได้</span>
                        </label>
                    </div>
                </div>

                <!-- Conditional Location Dropdown -->
                <div id="locationContainer" class="mb-8 hidden opacity-0 transition-opacity duration-300">
                    <label for="location" class="block text-sm font-semibold text-gray-700 mb-1">รูปแบบการเข้าร่วม <span class="text-red-500">*</span></label>
                    <select id="location" name="location"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white appearance-none transition-colors">
                        <option value="" disabled selected>-- กรุณาเลือกรูปแบบ --</option>
                        <option value="ห้องประชุมอาคาร 75 ปี จ.เชียงใหม่">ห้องประชุมอาคาร 75 ปี จ.เชียงใหม่</option>
                        <option value="Online">Online</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5">
                    ส่งข้อมูล (Submit)
                </button>
            </form>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // Configuration: ใส่ Web App URL ของ Google Apps Script ที่นี่
        // ---------------------------------------------------------
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxD3-cA14WD0OT5251rLsr3foK-MtTmNHcrbsdvfetiHRD-p3jUpQsdvDf4q14vyCbw/exec';

        const form = document.getElementById('rsvpForm');
        const locationContainer = document.getElementById('locationContainer');
        const locationSelect = document.getElementById('location');

        // ฟังก์ชันควบคุมการแสดงผลและกำหนดการบังคับเลือก (Required) ของช่องรูปแบบการเข้าร่วม
        function toggleLocationField() {
            const attendanceInput = document.querySelector('input[name="attendance"]:checked');
            
            if (!attendanceInput) return; 
        
            const attendanceValue = attendanceInput.value;
        
            if (attendanceValue === 'เข้าร่วมได้') {
                locationContainer.classList.remove('hidden'); 
                locationContainer.classList.remove('opacity-0');
                locationSelect.required = true; // บังคับให้เลือกเมื่อเข้าร่วมได้
            } else {
                locationContainer.classList.add('hidden'); 
                locationContainer.classList.add('opacity-0');
                locationSelect.required = false; // ยกเลิกการบังคับเมื่อไม่เข้าร่วม
                locationSelect.value = ''; // ล้างค่าที่เลือกไว้
            }
        }       

        // Form submission handler
        form.addEventListener('submit', e => {
            e.preventDefault(); 

            // แสดงสถานะกำลังบันทึก
            Swal.fire({
                title: 'กำลังบันทึกข้อมูล...',
                text: 'กรุณารอสักครู่',
                allowOutsideClick: false,
                allowEscapeKey: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            // ดึงค่าจากฟอร์มมาแปลงเป็น Object JSON
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            // หากเลือก "ไม่สามารถเข้าร่วมได้" ให้ส่งค่าช่อง location เป็นค่าว่าง
            if (data['attendance'] === 'ไม่สามารถเข้าร่วมได้') {
                data['location'] = 'ไม่เข้าร่วมประชุม';
            }

            // Demo mode fallback ถ้ายังไม่ได้เปลี่ยน URL
            if (SCRIPT_URL === 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE') {
                setTimeout(() => {
                    showSuccessAndReset();
                }, 1500);
                return;
            }

            // ส่งข้อมูลไปยัง Google Apps Script
            fetch(SCRIPT_URL, { 
                method: 'POST', 
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                if (result.result === 'success') {
                    showSuccessAndReset();
                } else {
                    throw new Error(result.error || 'Unknown error');
                }
            })
            .catch(error => {
                console.error('Error!', error);
                Swal.fire({
                    icon: 'error',
                    title: 'เกิดข้อผิดพลาด!',
                    text: 'ไม่สามารถส่งข้อมูลได้ กรุณาลองใหม่อีกครั้ง',
                    confirmButtonColor: '#d33',
                    confirmButtonText: 'ตกลง'
                });
            });
        });

        // Helper function เมื่อบันทึกสำเร็จ
        function showSuccessAndReset() {
            Swal.fire({
                icon: 'success',
                title: 'บันทึกข้อมูลสำเร็จ!',
                text: 'ขอบคุณสำหรับการตอบรับเข้าร่วมประชุม',
                confirmButtonColor: '#2563eb',
                confirmButtonText: 'ตกลง'
            }).then(() => {
                form.reset(); 
                toggleLocationField(); // ซ่อนกล่องตัวเลือกและรีเซ็ตค่า
            });
        }
    </script>
</body>
</html>

```
